<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S | AI Ассистент</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a3e, #2d1b69);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #2a2a5a;
        }

        .header .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #f0f0f0;
        }

        .header .status {
            margin-left: auto;
            font-size: 13px;
            color: #a0a0c0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header .status .dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        /* Chat area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #3a3a6a;
            border-radius: 3px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 75%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.assistant .avatar {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
        }

        .message .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.assistant .bubble {
            background: #1e1e3f;
            border: 1px solid #2a2a5a;
            border-top-left-radius: 4px;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            border-top-right-radius: 4px;
        }

        /* Typing indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            gap: 12px;
            max-width: 75%;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 16px;
            background: #1e1e3f;
            border: 1px solid #2a2a5a;
            border-radius: 16px;
            border-top-left-radius: 4px;
        }

        .typing-label {
            font-size: 13px;
            color: #a080d0;
            margin-top: 4px;
            padding-left: 4px;
        }

        /* Tool badge */
        .tool-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #1a1a4a;
            border: 1px solid #3a3a7a;
            border-radius: 8px;
            font-size: 12px;
            color: #a0a0e0;
            margin-bottom: 6px;
        }

        .tool-badge::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #7c3aed;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Welcome message */
        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: #8080b0;
        }

        .welcome h2 {
            font-size: 28px;
            color: #c0c0e0;
            margin-bottom: 8px;
        }

        .welcome p {
            font-size: 16px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .suggestion {
            padding: 10px 18px;
            background: #1e1e3f;
            border: 1px solid #2a2a5a;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #b0b0d0;
            transition: all 0.2s;
        }

        .suggestion:hover {
            background: #2a2a5a;
            color: #e0e0ff;
            border-color: #7c3aed;
        }

        /* Input area */
        .input-area {
            padding: 16px 24px;
            background: #141430;
            border-top: 1px solid #2a2a5a;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .input-wrapper textarea {
            flex: 1;
            padding: 14px 18px;
            background: #1e1e3f;
            border: 1px solid #2a2a5a;
            border-radius: 16px;
            color: #e0e0e0;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 50px;
            max-height: 150px;
            transition: border-color 0.2s;
        }

        .input-wrapper textarea:focus {
            border-color: #7c3aed;
        }

        .input-wrapper textarea::placeholder {
            color: #6060a0;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, opacity 0.2s;
            align-self: flex-end;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        /* Error */
        .error-message {
            background: #3b1133;
            border: 1px solid #7f1d4e;
            color: #f0a0c0;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            max-width: 75%;
            animation: fadeIn 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .message { max-width: 90%; }
            .header h1 { font-size: 17px; }
            .suggestions { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">J</div>
        <h1>J.A.R.V.I.S</h1>
        <div class="status">
            <span class="dot"></span>
            Онлайн
        </div>
    </div>

    <div class="chat-container" id="chat">
        <div class="welcome" id="welcome">
            <h2>Привет! Я J.A.R.V.I.S</h2>
            <p>Я умею искать в интернете, читать сайты и запоминать информацию</p>
            <div class="suggestions">
                <div class="suggestion" onclick="useSuggestion(this)">Что сегодня в новостях?</div>
                <div class="suggestion" onclick="useSuggestion(this)">Найди информацию о Кыргызстане</div>
                <div class="suggestion" onclick="useSuggestion(this)">Какая погода в Бишкеке?</div>
                <div class="suggestion" onclick="useSuggestion(this)">Запомни что меня зовут...</div>
            </div>
        </div>

        <div class="typing-indicator" id="typing">
            <div class="avatar" style="background: linear-gradient(135deg, #7c3aed, #a855f7); color: white;">J</div>
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea
                id="userInput"
                placeholder="Напишите сообщение..."
                rows="1"
                onkeydown="handleKey(event)"
                oninput="autoResize(this)"
            ></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typing = document.getElementById('typing');
        const welcome = document.getElementById('welcome');
        const API_URL = '/api/chat';

        let history = [];

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function useSuggestion(el) {
            input.value = el.textContent;
            sendMessage();
        }

        function addMessage(role, text) {
            if (welcome) welcome.style.display = 'none';

            const div = document.createElement('div');
            div.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? 'Я' : 'J';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            div.appendChild(avatar);
            div.appendChild(bubble);

            chat.insertBefore(div, typing);
            scrollToBottom();
        }

        function showError(text) {
            const div = document.createElement('div');
            div.className = 'error-message';
            div.textContent = text;
            chat.insertBefore(div, typing);
            scrollToBottom();
        }

        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage('user', text);
            history.push({ role: 'user', content: text });

            typing.classList.add('active');
            scrollToBottom();

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: history })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || `Ошибка сервера: ${res.status}`);
                }

                const data = await res.json();
                const reply = data.reply;

                history.push({ role: 'assistant', content: reply });
                addMessage('assistant', reply);
            } catch (err) {
                showError('Ошибка: ' + err.message);
            } finally {
                typing.classList.remove('active');
                sendBtn.disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>
